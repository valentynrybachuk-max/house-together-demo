name: Publish WebGL demo

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag containing HouseTogetherDemo-WebGL.zip
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Download the built game
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir package site
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'HouseTogetherDemo-WebGL.zip' --dir package
          unzip -q package/HouseTogetherDemo-WebGL.zip -d site
          test -f site/index.html
          test -f site/Build/WebGL.loader.js
          touch site/.nojekyll

      - name: Prepare the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the game
        id: deployment
        uses: actions/deploy-pages@v4
